<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nodecal" />
    <title>Nodecal</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/client/styles/app.css" />
    <!-- Apply saved theme before first paint to avoid flash -->
    <script>
      (function () {
        var t = localStorage.getItem('nc-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      })();
      // Service worker registration lives in client/app/swUpdate.js.
    </script>
  </head>
  <body>
    <div
      id="login-overlay"
      class="login-overlay fixed inset-0 z-[var(--z-overlay)] flex animate-[fadeIn_0.2s_ease] items-center justify-center bg-bg pt-[calc(var(--spacing-md)+var(--app-safe-area-top))] pr-[calc(var(--spacing-md)+var(--app-safe-area-right))] pb-[calc(var(--spacing-md)+var(--app-safe-area-bottom))] pl-[calc(var(--spacing-md)+var(--app-safe-area-left))] hidden"
    >
      <div
        class="flex w-9/10 max-w-login flex-col gap-lg rounded-md border border-border bg-surface px-lg py-xl shadow-modal"
      >
        <h1 class="text-center text-xl font-bold">Nodecal</h1>
        <form id="login-form" autocomplete="on">
          <input
            type="text"
            name="username"
            id="login-username"
            value="nodecal"
            autocomplete="username"
            style="display: none"
            aria-hidden="true"
          />
          <div class="modal-field">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter password"
            />
          </div>
          <div id="login-error" class="py-xs text-center text-sm text-danger hidden">
            Wrong password — try again
          </div>
          <button type="submit" class="btn btn-primary w-full">Sign in</button>
        </form>
      </div>
    </div>

    <div
      id="app"
      class="flex h-dvh flex-col overflow-hidden pb-[calc(var(--nav-height)+var(--app-safe-area-bottom))]"
    >
      <header
        class="flex h-[calc(var(--header-height)+var(--app-safe-area-top))] shrink-0 items-center justify-between border-b border-border bg-bg pt-[var(--app-safe-area-top)] pr-[calc(var(--spacing-md)+var(--app-safe-area-right))] pl-[calc(var(--spacing-md)+var(--app-safe-area-left))]"
      >
        <button class="icon-btn" id="cal-btn" title="Calendars">☰</button>
        <h1 id="header-title" class="text-lg font-semibold">Nodecal</h1>
        <div class="flex items-center gap-2xs">
          <button
            class="max-w-profile shrink-0 overflow-hidden rounded-full border border-accent bg-accent-light px-control py-pill-y text-sm leading-[1.4] font-semibold text-ellipsis whitespace-nowrap text-accent"
            id="profile-switch"
            title="Switch profile"
            hidden
          ></button>
          <button class="icon-btn" id="search-btn" title="Search">⌕</button>
          <button class="icon-btn" id="theme-btn" title="Toggle theme">◐</button>
          <button class="icon-btn" id="settings-btn" title="Settings">⚙&#xFE0E;</button>
          <button class="icon-btn sync-btn" id="sync-btn" title="Sync">↻</button>
        </div>
      </header>

      <!-- Copy comes from OFFLINE_MESSAGE in client/app/main.js, which is the
           only thing that ever unhides this banner. -->
      <div id="offline-status" class="offline-status hidden" role="status" aria-live="polite"></div>
      <div id="sync-error" class="sync-error hidden"></div>

      <main id="view-container" class="min-h-0 flex-1 overflow-y-auto pb-xl"></main>

      <div
        id="cal-quickadd"
        class="fixed right-0 bottom-[calc(var(--nav-height)+var(--app-safe-area-bottom))] left-0 z-50 flex flex-col gap-0 border-t border-border bg-bg pt-sm pr-[calc(var(--spacing-md)+var(--app-safe-area-right))] pb-sm pl-[calc(var(--spacing-md)+var(--app-safe-area-left))] hidden"
      >
        <div id="cal-quickadd-target" class="mb-xs flex flex-wrap items-center gap-sm" hidden></div>
        <div class="flex items-center gap-sm">
          <input
            type="text"
            id="cal-quickadd-input"
            class="flex-1 rounded-md px-md py-control text-md"
            placeholder="Add event… e.g. Meeting tomorrow 14:00"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            class="flex h-xl w-xl shrink-0 items-center justify-center rounded-full bg-accent text-lg text-on-accent"
            id="cal-quickadd-submit"
            aria-label="Add"
          >
            ↵
          </button>
        </div>
        <div class="nlp-feedback hidden" id="cal-quickadd-nlp-fb"></div>
      </div>

      <nav class="bottom-nav" id="bottom-nav"></nav>

      <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-sheet"></div>
      </div>

      <div id="cal-drawer-overlay" class="fixed inset-0 z-50 bg-overlay hidden">
        <div
          class="cal-drawer absolute top-0 bottom-0 left-0 w-[min(var(--container-drawer),85vw)] overflow-y-auto bg-bg pt-[calc(var(--spacing-lg)+var(--app-safe-area-top))] pr-[calc(var(--spacing-md)+var(--app-safe-area-right))] pb-[calc(var(--spacing-lg)+var(--app-safe-area-bottom))] pl-[calc(var(--spacing-md)+var(--app-safe-area-left))] shadow-drawer"
        >
          <h2 class="mb-md text-lg">Calendars</h2>
          <div id="cal-list"></div>
        </div>
      </div>

      <div id="settings-overlay" class="modal-overlay hidden">
        <div class="settings-sheet"></div>
      </div>

      <div
        id="search-overlay"
        class="fixed inset-0 z-[var(--z-overlay)] flex flex-col items-stretch bg-overlay hidden"
      >
        <div class="flex max-h-[80dvh] flex-col rounded-b-md bg-bg pt-[var(--app-safe-area-top)]">
          <div class="flex items-center gap-sm border-b border-border px-md py-sm">
            <input
              type="search"
              id="search-input"
              class="flex-1 border-0 bg-transparent py-sm text-lg text-text outline-none"
              placeholder="Search events and tasks…"
              autocomplete="off"
            />
            <button class="icon-btn" id="search-close">✕</button>
          </div>
          <div id="search-results" class="flex-1 overflow-y-auto"></div>
        </div>
      </div>

      <div
        id="install-banner"
        class="fixed right-[calc(var(--spacing-md)+var(--app-safe-area-right))] bottom-[calc(var(--nav-height)+var(--spacing-sm)+var(--app-safe-area-bottom))] left-[calc(var(--spacing-md)+var(--app-safe-area-left))] z-[var(--z-install-banner)] flex items-center gap-sm rounded-md border border-border bg-surface px-md py-sm shadow-banner hidden"
      >
        <span class="install-text flex-1 text-sm">Add Nodecal to your home screen</span>
        <button id="install-btn" class="btn btn-primary">Install</button>
        <button id="install-dismiss" class="btn btn-ghost">✕</button>
      </div>
    </div>

    <script type="module" src="/client/app/main.js"></script>
  </body>
</html>
